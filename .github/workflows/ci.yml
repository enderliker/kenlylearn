name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality-gates:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: ESLint Static Analysis
        run: npm run lint

  security-audit:
    name: Security & Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Audit Dependencies for Known CVEs
        run: npm audit --audit-level=high
        continue-on-error: true

  build-verification:
    name: Next.js Production Build
    needs: [quality-gates]
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      ENCRYPTION_SECRET: 01234567890123456789012345678901
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Production Build
        run: npm run build

  vercel-deployment:
    name: Vercel Deployment Check
    needs: [build-verification]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment Notice
        run: |
          echo "✅ Production branch 'main' successfully validated by CI quality gates."
          echo "🚀 Vercel GitHub integration automatically deploys verified commits to production."
